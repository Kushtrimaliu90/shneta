project_id = "biocode"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

# seed.sql holds configuration and taxonomy (production-appropriate); seeds/ holds the demo
# catalogue, which is local and staging only. Split so one file does not become unreviewable.
[db.seed]
enabled = true
sql_paths = ['./seed.sql', './seeds/*.sql']

[studio]
enabled = true
port = 54323

# Local inbox for auth and transactional email (docs/09 §2).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# docs/10 §4 — email + password only in v1; anonymous sign-ins off.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
