name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # docs/10 §2 job 1 — fast feedback, no services required.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docs/08 §1 — sq and en must stay in lockstep.
      - name: Check i18n key parity
        run: pnpm check:i18n

      # Offline structural check on the migrations. Not a substitute for `db reset`,
      # which the integration job runs — it just fails fast on shape errors.
      - name: Check SQL structure
        run: pnpm check:sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  # docs/10 §2 job 2 — real Postgres, real migrations, real browser.
  integration:
    name: Integration and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed the environment from .env.example
        # The example file holds the documented `supabase start` defaults, so CI exercises
        # the same fail-fast env validation the app uses in production (docs/10 §3).
        run: cp .env.example .env.local

      - uses: supabase/setup-cli@v1
        with:
          # The version the repo itself pins in devDependencies — `latest` let the CI CLI
          # drift ahead of the config.toml this repo was developed against, which is the
          # usual way `supabase start` breaks on a runner while working locally. Keep the
          # two in lockstep: bump this together with the `supabase` devDependency.
          version: 2.110.0

      - name: Start Supabase
        # Skips until the M1 migrations land, so M0 can go green on its own.
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: supabase start

      - name: Use the keys the local stack actually issued
        # CLI 2.110 starts the local stack with the new `sb_publishable_…` / `sb_secret_…` keys and
        # no longer honours the legacy JWT demo keys .env.example carries. With the example keys every
        # query answered 401, every fixture helper saw `null`, and all 24 integration files failed in
        # `beforeAll` with "No default warehouse — did the seed run?" (it had). So the keys are read
        # back from the running stack, whichever format it prints, and written over the example's.
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: |
          supabase status -o env > /tmp/supabase-status.env
          node -e '
            const fs = require("fs");
            const kv = Object.fromEntries(
              fs.readFileSync("/tmp/supabase-status.env", "utf8").split("\n").filter(Boolean).map((line) => {
                const i = line.indexOf("=");
                return [line.slice(0, i).trim(), line.slice(i + 1).trim().replace(/^"|"$/g, "")];
              }),
            );
            const anon = kv.PUBLISHABLE_KEY || kv.ANON_KEY;
            const secret = kv.SECRET_KEY || kv.SERVICE_ROLE_KEY;
            if (!anon || !secret) { console.error("status keys:", Object.keys(kv).join(", ")); process.exit(1); }
            let env = fs.readFileSync(".env.local", "utf8");
            env = env
              .replace(/^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*$/m, "NEXT_PUBLIC_SUPABASE_ANON_KEY=" + anon)
              .replace(/^SUPABASE_SERVICE_ROLE_KEY=.*$/m, "SUPABASE_SERVICE_ROLE_KEY=" + secret);
            fs.writeFileSync(".env.local", env);
            console.log("anon:", anon.slice(0, 15) + "…", "service:", secret.slice(0, 10) + "…");
          '

      - name: Apply migrations and seed
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: supabase db reset --no-seed=false

      # docs/09 §1 — RLS matrix, checkout RPC, order state machine, ledger invariant.
      # `tables_without_rls()` asserts the docs/10 §4 guarantee inside the suite, and the
      # global teardown purges the fixtures the suite creates (docs/13 §G2).
      - name: Integration tests
        if: ${{ hashFiles('supabase/config.toml') != '' }}
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # A regression here is invisible in review but real for users on mobile, so the
      # budget from docs/09 §3 is enforced rather than trusted.
      - name: Enforce First Load JS budget
        run: pnpm check:bundle

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # docs/10 §2 job 3 — fail on criticals.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level critical
